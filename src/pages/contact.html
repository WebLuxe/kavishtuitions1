<section class="phead wrap" data-hero data-scene="contact">
  <span class="eyebrow" data-in>Contact</span>
  <h1 class="d1" data-rise-now>Let's <em>talk.</em></h1>
  <p class="lede" data-in>Tell me a little about the student and how I can help.</p>
</section>

<section class="wrap two" style="padding-bottom:72px" aria-label="Ways to reach Kavish">
  <div class="contactl" id="contactList" data-fade>
    <a class="cl" href="{{wa}}" target="_blank" rel="noopener"><span class="i">{{i:wa}}</span><span><small>WhatsApp</small><b>+230 5923 8436</b></span>{{i:arrow}}</a>
    <a class="cl" href="tel:+23059238436"><span class="i">{{i:phone}}</span><span><small>Call</small><b>+230 5923 8436</b></span>{{i:arrow}}</a>
    <div class="cl" style="grid-template-columns:48px 1fr"><span class="i">{{i:pin}}</span><span><small>Where</small><b>Moka, Mauritius</b></span></div>
  </div>
  <form class="panel" id="contactForm" style="padding:clamp(18px,3vw,28px)" novalidate data-fade>
    <div class="formrow">
      <label class="field">Your name<input type="text" id="cName" name="name" autocomplete="name" enterkeyhint="next" required></label>
      <label class="field">Phone<input type="tel" id="cPhone" name="tel" autocomplete="tel" inputmode="tel" enterkeyhint="next" required></label>
    </div>
    <div class="formrow">
      <label class="field">Subject<select id="cSub" name="subject"><option>Mathematics</option><option>Additional Mathematics</option><option>Both</option></select></label>
      <label class="field">Grade<select id="cGrade" name="grade"><option>Grade 9 (NCE)</option><option>Grade 10 (SC / IGCSE)</option><option>Grade 11 (SC / IGCSE)</option><option>Grade 12 (HSC / A-Level)</option><option>Grade 13 (HSC / A-Level)</option></select></label>
    </div>
    <label class="field">Anything I should know?<textarea id="cMsg" name="message" rows="3" enterkeyhint="send"></textarea></label>
    <button class="btn btn--wa btn--wide" style="margin-top:16px">{{i:wa}}Send on WhatsApp</button>
    <p class="err" id="cErr" role="alert"></p>
  </form>
</section>
